<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="1770" viewBox="0 0 1570 1770" role="img" aria-labelledby="title desc">
<title id="title">ER · данные проверки и история оснований</title><desc id="desc">Логическая модель расширения · PK — ключ, FK — ссылка; 0..N — любое число, включая ноль</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#26364a" stroke-width="2"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#26364a">
<text x="44" y="48" font-size="29" text-anchor="start" font-weight="700">
<tspan x="44" dy="0">ER · данные проверки и история оснований</tspan>
</text>
<text x="44" y="84" font-size="21" text-anchor="start">
<tspan x="44" dy="0">Логическая модель расширения · PK — ключ, FK — ссылка; 0..N — любое число, включая ноль</tspan>
</text>
<rect x="50" y="140" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="50" y="140" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="68" y="173" font-size="23" text-anchor="start" font-weight="700">
<tspan x="68" dy="0">Точка · ServicePoint</tspan>
</text>
<text x="68" y="221" font-size="21" text-anchor="start">
<tspan x="68" dy="0">PK point_id</tspan>
<tspan x="68" dy="27.3">name, address</tspan>
<tspan x="68" dy="27.3">input_revision, generation</tspan>
<tspan x="68" dy="27.3">current_binding_id?</tspan>
<tspan x="68" dy="27.3">current_assessment_id?</tspan>
</text>
<rect x="575" y="140" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="575" y="140" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="593" y="173" font-size="23" text-anchor="start" font-weight="700">
<tspan x="593" dy="0">Связь · SubjectBinding</tspan>
</text>
<text x="593" y="221" font-size="21" text-anchor="start">
<tspan x="593" dy="0">PK binding_id; FK point_id</tspan>
<tspan x="593" dy="27.3">FK subject_id; revision</tspan>
<tspan x="593" dy="27.3">valid_from, valid_to?</tspan>
<tspan x="593" dy="27.3">state, basis_ref</tspan>
<tspan x="593" dy="27.3">0..1 подтверждённых текущих</tspan>
</text>
<rect x="1100" y="140" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="1100" y="140" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="1118" y="173" font-size="23" text-anchor="start" font-weight="700">
<tspan x="1118" dy="0">Субъект · LegalSubject</tspan>
</text>
<text x="1118" y="221" font-size="21" text-anchor="start">
<tspan x="1118" dy="0">PK subject_id; kind: ЮЛ / ИП</tspan>
<tspan x="1118" dy="27.3">inn, ogrn_or_ogrnip</tspan>
<tspan x="1118" dy="27.3">registered_on, registry_status</tspan>
<tspan x="1118" dy="27.3">UNIQUE(kind, inn, ogrn_or_ogrnip)</tspan>
<tspan x="1118" dy="27.3">Возраст регистрации ≠ стаж точки</tspan>
</text>
<rect x="50" y="550" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="50" y="550" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="68" y="583" font-size="23" text-anchor="start" font-weight="700">
<tspan x="68" dy="0">Проверка · CheckRun</tspan>
</text>
<text x="68" y="631" font-size="21" text-anchor="start">
<tspan x="68" dy="0">PK run_id; FK binding_id</tspan>
<tspan x="68" dy="27.3">request_key, generation</tspan>
<tspan x="68" dy="27.3">captured_versions, lease_epoch</tspan>
<tspan x="68" dy="27.3">state, lease_until</tspan>
<tspan x="68" dy="27.3">method_snapshot, input_snapshot</tspan>
</text>
<rect x="575" y="550" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="575" y="550" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="593" y="583" font-size="23" text-anchor="start" font-weight="700">
<tspan x="593" dy="0">Источник · SourceResult</tspan>
</text>
<text x="593" y="631" font-size="21" text-anchor="start">
<tspan x="593" dy="0">PK source_result_id; FK run_id</tspan>
<tspan x="593" dy="27.3">source_code, query_scope</tspan>
<tspan x="593" dy="27.3">observed_at, source_as_of?</tspan>
<tspan x="593" dy="27.3">outcome, coverage, valid_until</tspan>
<tspan x="593" dy="27.3">Нормализованный снимок + хеш</tspan>
</text>
<rect x="1100" y="550" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="1100" y="550" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="1118" y="583" font-size="23" text-anchor="start" font-weight="700">
<tspan x="1118" dy="0">Факт · Fact</tspan>
</text>
<text x="1118" y="631" font-size="21" text-anchor="start">
<tspan x="1118" dy="0">PK (fact_id, revision)</tspan>
<tspan x="1118" dy="27.3">FK subject_id; point_id?</tspan>
<tspan x="1118" dy="27.3">event_key, kind, event_date</tspan>
<tspan x="1118" dy="27.3">role, outcome, confirmation</tspan>
<tspan x="1118" dy="27.3">resolution, scope: ЮЛ / точка</tspan>
</text>
<rect x="50" y="970" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="50" y="970" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="68" y="1003" font-size="23" text-anchor="start" font-weight="700">
<tspan x="68" dy="0">Решение · AuditEvent</tspan>
</text>
<text x="68" y="1051" font-size="21" text-anchor="start">
<tspan x="68" dy="0">PK audit_id; FK binding_id</tspan>
<tspan x="68" dy="27.3">actor, action, at, reason</tspan>
<tspan x="68" dy="27.3">old_revision, new_revision</tspan>
<tspan x="68" dy="27.3">request / decision / correction</tspan>
<tspan x="68" dy="27.3">Документы — закрытые ссылки</tspan>
</text>
<rect x="575" y="970" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="575" y="970" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="593" y="1003" font-size="23" text-anchor="start" font-weight="700">
<tspan x="593" dy="0">Оценка · Assessment</tspan>
</text>
<text x="593" y="1051" font-size="21" text-anchor="start">
<tspan x="593" dy="0">PK assessment_id; FK run_id</tspan>
<tspan x="593" dy="27.3">state, score?; valid_until</tspan>
<tspan x="593" dy="27.3">identification, registry_status</tspan>
<tspan x="593" dy="27.3">method_snapshot, explanation</tspan>
<tspan x="593" dy="27.3">Неизменяемый результат</tspan>
</text>
<rect x="1100" y="970" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="1100" y="970" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="1118" y="1003" font-size="23" text-anchor="start" font-weight="700">
<tspan x="1118" dy="0">Основание факта · FactEvidence</tspan>
</text>
<text x="1118" y="1051" font-size="21" text-anchor="start">
<tspan x="1118" dy="0">PK evidence_id</tspan>
<tspan x="1118" dy="27.3">FK (fact_id, fact_revision)</tspan>
<tspan x="1118" dy="27.3">FK source_result_id</tspan>
<tspan x="1118" dy="27.3">external_ref, source_fragment</tspan>
<tspan x="1118" dy="27.3">Несколько оснований события</tspan>
</text>
<rect x="575" y="1390" width="420" height="238" rx="4" fill="white" stroke="#26364a" stroke-width="2"/>
<rect x="575" y="1390" width="420" height="49" rx="4" fill="#eaf2fc" stroke="#26364a" stroke-width="2"/>
<text x="593" y="1423" font-size="23" text-anchor="start" font-weight="700">
<tspan x="593" dy="0">Вклад · AssessmentEvidence</tspan>
</text>
<text x="593" y="1471" font-size="21" text-anchor="start">
<tspan x="593" dy="0">PK (assessment_id, fact_id)</tspan>
<tspan x="593" dy="27.3">FK assessment_id</tspan>
<tspan x="593" dy="27.3">FK (fact_id, fact_revision)</tspan>
<tspan x="593" dy="27.3">factor_code, value, contribution</tspan>
<tspan x="593" dy="27.3">explanation; один вклад события</tspan>
</text>
<polyline points="470,250 575,250" fill="none" stroke="#26364a" stroke-width="2.2" />
<text x="522" y="231" font-size="20" text-anchor="middle">
<tspan x="522" dy="0">история</tspan>
</text>
<text x="486" y="278" font-size="20" text-anchor="middle" font-weight="700">
<tspan x="486" dy="0">1</tspan>
</text>
