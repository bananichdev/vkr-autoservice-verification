</text>
<polyline points="1310,788 1310,970" fill="none" stroke="#26364a" stroke-width="2.2" />
<text x="1410" y="885" font-size="20" text-anchor="middle">
<tspan x="1410" dy="0">подтверждается</tspan>
</text>
<text x="1277" y="824" font-size="20" text-anchor="middle" font-weight="700">
<tspan x="1277" dy="0">1</tspan>
</text>
<text x="1270" y="943" font-size="20" text-anchor="middle" font-weight="700">
