</text>
<polyline points="1520,665 1545,665 1545,1510 995,1510" fill="none" stroke="#26364a" stroke-width="2.2" />
<text x="1410" y="1487" font-size="20" text-anchor="middle">
<tspan x="1410" dy="0">учитывается</tspan>
</text>
<text x="1532" y="634" font-size="20" text-anchor="middle" font-weight="700">
<tspan x="1532" dy="0">1</tspan>
</text>
<text x="1035" y="1541" font-size="20" text-anchor="middle" font-weight="700">
<tspan x="1035" dy="0">0..N</tspan>
