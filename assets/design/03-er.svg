<rect x="50" y="1390" width="420" height="235" rx="4" fill="#fff5df" stroke="#26364a" stroke-width="2"/>
<text x="260.0" y="1432.74" font-size="21" text-anchor="middle">
<tspan x="260.0" dy="0">Смена ЮЛ/ИП закрывает старую</tspan>
<tspan x="260.0" dy="27.3">связь и создаёт новую.</tspan>
<tspan x="260.0" dy="27.3">Указатель текущей оценки</tspan>
<tspan x="260.0" dy="27.3">меняется атомарно вместе</tspan>
<tspan x="260.0" dy="27.3">с проверкой версий задания.</tspan>
<tspan x="260.0" dy="27.3">Другие поля и сущности</tspan>
<tspan x="260.0" dy="27.3">агрегатора здесь опущены.</tspan>
</text>
<text x="50" y="1700" font-size="22" text-anchor="start">
<tspan x="50" dy="0">FactEvidence хранит происхождение; AssessmentEvidence — влияние события на конкретную оценку.</tspan>
<tspan x="50" dy="28.6">Период события сопоставляется с периодом связи; юридический факт остаётся фактом уровня ЮЛ/ИП.</tspan>
</text>
</g></svg>
