<polyline points="850,440 850,455" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="720,510 60,510 60,1810 224,1810" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="400" y="490" font-size="20" text-anchor="middle">
<tspan x="400" dy="0">[да]</tspan>
</text>
<polyline points="850,565 850,598" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="895" y="588" font-size="20" text-anchor="middle">
<tspan x="895" dy="0">[нет]</tspan>
</text>
<polyline points="850,622 850,660" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="850,760 850,800" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="850,900 850,920" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="740,970 572,970 572,1090" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="540" y="1040" font-size="20" text-anchor="middle">
<tspan x="540" dy="0">[нет данных / несовпадение]</tspan>
</text>
<polyline points="960,970 1170,970" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1060" y="946" font-size="20" text-anchor="middle">
<tspan x="1060" dy="0">[спорная связь]</tspan>
</text>
<polyline points="850,1020 850,1120" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="940" y="1072" font-size="20" text-anchor="middle">
<tspan x="940" dy="0">[подтверждена]</tspan>
</text>
<polyline points="1310,1030 1310,1110" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1450,1165 1465,1165 1465,610 862,610" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1270" y="588" font-size="20" text-anchor="middle">
<tspan x="1270" dy="0">новая проверка</tspan>
</text>
<polyline points="850,1220 850,1280" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="850,1390 850,1444" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="572,1225 572,1460 834,1460" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="850,1476 850,1495" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="700,1560 655,1560" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="678" y="1539" font-size="20" text-anchor="middle">
<tspan x="678" dy="0">[нет]</tspan>
</text>
<polyline points="572,1610 572,1668" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="850,1625 850,1670" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="895" y="1652" font-size="20" text-anchor="middle">
<tspan x="895" dy="0">[да]</tspan>
</text>
<polyline points="670,1720 470,1720 470,1770 240,1770 240,1794" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="240,1826 240,1855" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="240,1925 240,1928" fill="none" stroke="#26364a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1170" y="1750" width="280" height="175" rx="4" fill="#fff5df" stroke="#26364a" stroke-width="2"/>
<text x="1310.0" y="1792.3" font-size="20" text-anchor="middle">
<tspan x="1310.0" dy="0">Карточка показывает</tspan>
<tspan x="1310.0" dy="26.0">ожидание решения.</tspan>
<tspan x="1310.0" dy="26.0">Нет ответа источника —</tspan>
<tspan x="1310.0" dy="26.0">не доказательство</tspan>
<tspan x="1310.0" dy="26.0">отсутствия риска.</tspan>
</text>
